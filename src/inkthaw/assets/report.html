<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inkthaw report: $title</title>
<style>
:root {
  --bg: #fafaf8; --fg: #1d1d1b; --muted: #6b6b66; --card: #ffffff; --line: #e3e2dc;
  --bad: #b3261e; --warn: #9a6700; --good: #1a7f37; --mark: #fff3b0; --chip: #f0efe9;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #161615; --fg: #e9e8e3; --muted: #a2a19a; --card: #1f1f1d; --line: #34332f;
          --bad: #ff8a80; --warn: #e3b341; --good: #56d364; --mark: #4d4300; --chip: #2a2a27; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg);
       font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
header, main { max-width: 1200px; margin: 0 auto; padding: 16px; }
h1 { font-size: 1.4rem; margin: 0 0 4px; }
.sub { color: var(--muted); margin: 0 0 16px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 0.85rem; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0; }
.filters button { border: 1px solid var(--line); background: var(--chip); color: var(--fg);
                  border-radius: 999px; padding: 4px 10px; cursor: pointer; font: inherit; font-size: 0.85rem; }
.filters button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.page { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 16px;
        background: var(--card); border: 1px solid var(--line); border-radius: 8px;
        padding: 12px; margin-bottom: 12px; }
.page img { width: 100%; height: auto; border: 1px solid var(--line); background: #fff; }
.page h2 { font-size: 1rem; margin: 0 0 6px; }
.flags { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; padding: 0; list-style: none; }
.flags li { background: var(--chip); border-radius: 6px; padding: 2px 8px; font-size: 0.85rem; }
.flags li code { color: var(--bad); font-weight: 600; }
.text { white-space: pre-wrap; font-family: Georgia, serif; font-size: 0.95rem;
        max-height: 520px; overflow: auto; border-top: 1px solid var(--line); padding-top: 8px; }
.text p { margin: 0 0 0.6em; }
mark { background: var(--mark); color: inherit; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 4px 6px; border-bottom: 1px solid var(--line); }
details { margin-top: 24px; }
.score-good { color: var(--good); } .score-warn { color: var(--warn); } .score-bad { color: var(--bad); }
@media (max-width: 700px) { .page { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>$title</h1>
  <p class="sub">$subtitle</p>
  <div class="stats">$stats</div>
  <div class="filters" role="toolbar" aria-label="Filter flagged pages">$filters</div>
</header>
<main>
  $pages
  <details>
    <summary>All pages</summary>
    $table
  </details>
</main>
<script>
(() => {
  const buttons = document.querySelectorAll(".filters button");
  buttons.forEach(btn => btn.addEventListener("click", () => {
    buttons.forEach(b => b.setAttribute("aria-pressed", b === btn ? "true" : "false"));
    const code = btn.dataset.flag;
    document.querySelectorAll(".page").forEach(el => {
      el.hidden = code !== "all" && !el.dataset.flags.split(" ").includes(code);
    });
  }));
})();
</script>
</body>
</html>
