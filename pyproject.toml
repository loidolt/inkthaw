[project]
name = "rebind"
version = "0.0.1"
description = "Turn scanned PDFs into clean, reflowable EPUBs."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md"]
requires-python = ">=3.12"
authors = [{ name = "rebind contributors" }]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Markup",
    "Environment :: Console",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "rich>=13.7",
    "wordfreq>=3.1",
]

[project.optional-dependencies]
# Default OCR/layout engine (MIT). Kept optional so the core installs light.
# torch/torchvision are already Docling dependencies; listed so uv can pick the
# CPU wheel index on Linux (see [tool.uv.sources]).
docling = ["docling>=2.50", "torch", "torchvision"]

[project.scripts]
rebind = "rebind.cli:app"

[project.entry-points."rebind.engines"]
docling = "rebind.engines.docling_engine:DoclingEngine"

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-cov>=5",
]

# CI and local Linux dev get CPU-only torch wheels (much smaller). The CUDA
# Docker image installs CUDA wheels itself (M3). Not used for PyPI installs.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Typographic dashes/quotes are intentional in OCR-cleanup code.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = "warning"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: end-to-end tests that need external tools and the Docling engine",
]
