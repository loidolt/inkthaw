# Watch-folder service: drop PDFs into ./inbox, collect EPUBs from ./outbox.
#   docker compose up -d                          # CPU
#   docker compose --profile gpu up -d inkthaw-gpu # NVIDIA GPU
# Job folders (with report.html per book) are kept in ./jobs; model weights
# are downloaded once into ./models.

x-inkthaw: &inkthaw
  restart: unless-stopped
  user: "${INKTHAW_UID:-1000}:${INKTHAW_GID:-1000}"
  volumes:
    - ./inbox:/data/inbox
    - ./outbox:/data/outbox
    - ./jobs:/data/jobs
    - ./models:/models
    # Optional global settings:
    # - ./inkthaw.toml:/data/inkthaw.toml:ro

services:
  inkthaw:
    <<: *inkthaw
    image: ${INKTHAW_IMAGE:-inkthaw:cpu}
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu

  inkthaw-gpu:
    <<: *inkthaw
    profiles: ["gpu"]
    image: ${INKTHAW_GPU_IMAGE:-inkthaw:cuda}
    build:
      context: .
      dockerfile: docker/Dockerfile.cuda
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
