name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # No external tools: unit tests (including ingest -> rasterize ->
      # preprocess on a synthetic PDF) must pass with nothing but Python wheels.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run inkthaw doctor || true  # informative; no engine installed in this job
      - run: uv run pytest -m "not integration" --cov=inkthaw --cov-report=term-missing

  integration:
    runs-on: ubuntu-24.04
    needs: unit
    env:
      INKTHAW_MODELS_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      # EPUBCheck (+ Java) is optional but CI insists on it below. pandoc,
      # poppler and unpaper are deliberately not installed.
      - name: External tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            epubcheck default-jre-headless
          ! command -v pdftoppm && ! command -v unpaper && ! command -v pandoc
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: .models
          key: models-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: models-${{ runner.os }}-
      - run: uv sync --locked --extra docling
      - run: uv run inkthaw doctor
      - run: uv run inkthaw models
      - run: uv run python scripts/check_licenses.py
      - run: uv run pytest -m integration -v
        env:
          INKTHAW_REQUIRE_EPUBCHECK: "1"

  # The built wheel alone (no apt/brew packages) must ingest, render and clean
  # pages on Linux and macOS: what `uvx inkthaw` / `pipx install inkthaw` get.
  wheel:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Run from the wheel with no external tools
        run: |
          whl=$(ls dist/inkthaw-*.whl)
          uvx --isolated --from "$whl" inkthaw --version
          uvx --isolated --from "$whl" inkthaw run tests/fixtures/jekyll-5p.pdf \
            --to preprocess --jobs-dir "$RUNNER_TEMP/jobs"
          ls "$RUNNER_TEMP/jobs/jekyll-5p/20_clean"

  docker:
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpu
          load: true
          tags: inkthaw:cpu
          cache-from: type=gha,scope=ci-cpu
          cache-to: type=gha,mode=max,scope=ci-cpu
      - name: Smoke test
        run: docker run --rm inkthaw:cpu doctor
      - name: Licenses in the image
        run: docker run --rm -i --entrypoint python inkthaw:cpu - < scripts/check_licenses.py
