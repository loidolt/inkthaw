name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright

  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: External tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils unpaper pandoc epubcheck default-jre-headless
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run rebind doctor || true  # informative; no engine installed in this job
      - run: uv run pytest -m "not integration" --cov=rebind --cov-report=term-missing

  integration:
    runs-on: ubuntu-24.04
    needs: unit
    env:
      REBIND_MODELS_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - name: External tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils unpaper pandoc epubcheck default-jre-headless
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: .models
          key: models-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: models-${{ runner.os }}-
      - run: uv sync --locked --extra docling
      - run: uv run rebind doctor
      - run: uv run rebind models
      - run: uv run pytest -m integration -v

  docker:
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.cpu
          load: true
          tags: rebind:cpu
          cache-from: type=gha,scope=ci-cpu
          cache-to: type=gha,mode=max,scope=ci-cpu
      - name: Smoke test
        run: docker run --rm rebind:cpu doctor
