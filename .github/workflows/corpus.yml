name: Corpus benchmark

on:
  schedule:
    - cron: "17 3 * * 1"  # weekly, Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      book:
        description: "Book id from tests/corpus/manifest.toml (empty = all)"
        required: false
        default: ""

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      REBIND_MODELS_DIR: ${{ github.workspace }}/.models
    steps:
      - uses: actions/checkout@v4
      - name: External tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils unpaper pandoc epubcheck default-jre-headless
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/cache@v4
        with:
          path: |
            .models
            tests/corpus/downloads
          key: corpus-${{ hashFiles('uv.lock', 'tests/corpus/manifest.toml') }}
          restore-keys: corpus-
      - run: uv sync --locked --extra docling
      - run: uv run rebind models
      - name: Fetch, convert, score
        run: uv run python scripts/corpus.py all ${{ inputs.book }} --label "ci ${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-results
          path: |
            tests/corpus/results/
            tests/corpus/jobs/*/60_report/
            tests/corpus/jobs/*/50_build/book.epub
          if-no-files-found: warn
