name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            dockerfile: docker/Dockerfile.cpu
            platforms: linux/amd64,linux/arm64
            suffix: ""
          - variant: cuda
            dockerfile: docker/Dockerfile.cuda
            platforms: linux/amd64
            suffix: "-cuda"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=false
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

  release:
    runs-on: ubuntu-24.04
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Docker images:
            - CPU (amd64, arm64): `ghcr.io/${{ github.repository }}:${{ github.ref_name }}`
            - NVIDIA GPU (amd64): `ghcr.io/${{ github.repository }}:${{ github.ref_name }}-cuda`

  # DRAFT (M5): publish the sdist and wheel to PyPI with trusted publishing, so
  # `uvx --from 'inkthaw[docling]' inkthaw`, `pipx install 'inkthaw[docling]'` and
  # the Homebrew formula (packaging/homebrew/) work. Off until someone
  #   1. adds a (pending) trusted publisher on pypi.org for project "inkthaw",
  #      this repository, workflow "release.yml" and environment "pypi", and
  #   2. sets the repository variable PYPI_PUBLISH to "true".
  pypi:
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    needs: release
    environment:
      name: pypi
      url: https://pypi.org/p/inkthaw
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - name: Tag matches the package version
        run: test "v$(uv version --short)" = "$GITHUB_REF_NAME"
      - name: Wheel installs and runs without external tools
        run: |
          whl=$(ls dist/inkthaw-*.whl)
          uvx --isolated --from "$whl" inkthaw --version
          uvx --isolated --from "$whl" inkthaw run tests/fixtures/jekyll-5p.pdf \
            --to preprocess --jobs-dir "$RUNNER_TEMP/jobs"
      - uses: pypa/gh-action-pypi-publish@release/v1
